# Development override with hot reload
# Use: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Notes:
# - ./backend/app is mounted over /app/app, so all new services under
#   app/services (explanation_store_service, narrative_contract, ...) hot-reload.
# - ./policies:/policies:ro is inherited from the base compose file and is NOT
#   overridden here, so policy documents stay mounted in dev mode too.
# - Frontend port mapping (3000:80) is inherited from the base compose file.

version: '3.8'

services:
  backend:
    volumes:
      - ./backend/app:/app/app:ro  # Hot reload for Python code
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --log-level debug

  frontend:
    volumes:
      - ./frontend/src:/app/src:ro  # Hot reload for React code
    environment:
      - CHOKIDAR_USEPOLLING=true   # For file watching in Docker

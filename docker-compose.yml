version: '3.8'

services:
  database:
    image: postgres:16-alpine
    container_name: risk_platform_db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=risk_platform
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d risk_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: risk_platform_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:pass@database:5432/risk_platform
      - MODEL_PATH=/app/models
      - DEBUG=true
      # LLM explanation layer (optional; values come from the local untracked
      # .env via Compose variable interpolation — never hardcode secrets here)
      - ENABLE_LLM_EXPLANATION=${ENABLE_LLM_EXPLANATION:-false}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-}
      - EXPLAIN_LLM_TIMEOUT_SECONDS=${EXPLAIN_LLM_TIMEOUT_SECONDS:-30}
    volumes:
      - ./ml-models/artifacts:/app/models:ro
      # Policy documents for RAG citations / policy_version fingerprinting.
      # The services resolve the policies directory by walking up from
      # /app/app/services to the filesystem root, expecting /policies.
      - ./policies:/policies:ro
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      # python:3.12-slim has no curl — use the Python stdlib instead.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: risk_platform_frontend
    ports:
      # nginx listens on container port 80 (see frontend/nginx.conf);
      # the production build uses relative /api calls, proxied by nginx.
      - "3000:80"
    depends_on:
      - backend

volumes:
  pg_data:

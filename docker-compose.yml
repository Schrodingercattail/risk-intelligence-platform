version: '3.8'

services:
  database:
    image: postgres:16-alpine
    container_name: risk_platform_db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=risk_platform
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d risk_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: risk_platform_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:pass@database:5432/risk_platform
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - MODEL_PATH=/app/models
      - DEBUG=true
    volumes:
      - ./ml-models/artifacts:/app/models:ro
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: risk_platform_frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  pg_data:
